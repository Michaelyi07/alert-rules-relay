# Database alerts — postgres_exporter series
# Series consumed: pg_stat_database_numbackends, pg_settings_max_connections,
# pg_replication_lag_seconds, pg_slow_queries_total (counter), pg_last_backup_success_timestamp_seconds
groups:
  - name: database
    rules:
      - alert: DBConnectionRatioHigh
        expr: 100 * sum by (instance) (pg_stat_database_numbackends) / on (instance) group_left() pg_settings_max_connections > 80
        for: 5m
        labels:
          severity: warning
          family: database
        annotations:
          summary: "DB connection ratio > 80% ({{ $labels.instance }})"
          runbook_url: "https://runbook.example.invalid/ops/database#connections"
          dashboard_url: "https://grafana.example.invalid/d/database-overview?var-instance={{ $labels.instance }}"

      - alert: DBReplicationLagHigh
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
          family: database
        annotations:
          summary: "DB replication lag > 30s ({{ $labels.instance }})"
          runbook_url: "https://runbook.example.invalid/ops/database#replication-lag"
          dashboard_url: "https://grafana.example.invalid/d/database-overview?var-instance={{ $labels.instance }}"

      - alert: DBSlowQueriesHigh
        expr: increase(pg_slow_queries_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
          family: database
        annotations:
          summary: "Slow queries > 50 in 5m ({{ $labels.instance }})"
          runbook_url: "https://runbook.example.invalid/ops/database#slow-queries"
          dashboard_url: "https://grafana.example.invalid/d/database-overview?var-instance={{ $labels.instance }}"

      - alert: DBBackupOverdue
        expr: time() - pg_last_backup_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels:
          severity: warning
          family: database
        annotations:
          summary: "Last logical backup > 26h ago ({{ $labels.instance }})"
          runbook_url: "https://runbook.example.invalid/ops/database#backup"
          dashboard_url: "https://grafana.example.invalid/d/database-overview?var-instance={{ $labels.instance }}"
