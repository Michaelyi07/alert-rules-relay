# TLS certificate expiry alert — blackbox_exporter series
# Series consumed: probe_ssl_earliest_cert_expiry (unix seconds), probe_success
groups:
  - name: cert
    rules:
      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          family: cert
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in < 14 days"
          runbook_url: "https://runbook.example.invalid/ops/cert#expiry"
          dashboard_url: "https://grafana.example.invalid/d/cert-overview?var-instance={{ $labels.instance }}"
